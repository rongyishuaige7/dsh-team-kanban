<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能体任务板 · 交互原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234176e6'/%3E%3Cpath d='M9 10h4v12H9zM15 10h4v8h-4zM21 10h4v5h-4z' fill='white'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   0. 宿主 token 模拟 —— 仅原型使用；正式 client.js 不包含本段，
      直接读取 DSH 注入在 body 上的 --dsw-alias-* / --dsw-radius-*
   ===================================================================== */
body[data-theme="light"] {
  color-scheme: light;
  --dsw-alias-bg-base: #fff;
  --dsw-alias-bg-layer-1: #fff;
  --dsw-alias-bg-layer-2: #fff;
  --dsw-alias-card-fill: #fafafa;
  --dsw-alias-card-fill-hover: #f5f5f5;
  --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, 0.06);
  --dsw-alias-interactive-bg-active: rgba(38, 49, 72, 0.1);
  --dsw-alias-border-l1: rgba(0, 0, 0, 0.04);
  --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
  --dsw-alias-border-l3: rgba(0, 0, 0, 0.12);
  --dsw-alias-label-primary: #0f1115;
  --dsw-alias-label-primary-inverted: #fff;
  --dsw-alias-label-secondary: #61666b;
  --dsw-alias-label-tertiary: #81858c;
  --dsw-alias-label-on-color: #fff;
  --dsw-alias-state-business-primary: #4176e6;
  --dsw-alias-state-business-tertiary: #e4edfd;
  --dsw-alias-state-success-primary: #22c55e;
  --dsw-alias-state-success-tertiary: #e6faed;
  --dsw-alias-state-warn-primary: #f59e0b;
  --dsw-alias-state-warn-label: #dd8629;
  --dsw-alias-state-warn-tertiary: #fef5e7;
  --dsw-alias-state-idle-primary: #d4d4d4;
  --dsw-alias-state-error-primary: #ec1313;
  --dsw-radius-sm: 8px;
  --dsw-radius-md: 12px;
}
body[data-theme="dark"] {
  color-scheme: dark;
  --dsw-alias-bg-base: #151517;
  --dsw-alias-bg-layer-1: #232324;
  --dsw-alias-bg-layer-2: #2c2c2e;
  --dsw-alias-card-fill: #212123;
  --dsw-alias-card-fill-hover: #292929;
  --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);
  --dsw-alias-interactive-bg-active: rgba(255, 255, 255, 0.14);
  --dsw-alias-border-l1: rgba(255, 255, 255, 0.06);
  --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
  --dsw-alias-border-l3: rgba(255, 255, 255, 0.16);
  --dsw-alias-label-primary: #f9fafb;
  --dsw-alias-label-primary-inverted: #353638;
  --dsw-alias-label-secondary: #cfd3d6;
  --dsw-alias-label-tertiary: #adb2b8;
  --dsw-alias-label-on-color: #fff;
  --dsw-alias-state-business-primary: #7aaaff;
  --dsw-alias-state-business-tertiary: #34415b;
  --dsw-alias-state-success-primary: #22c55e;
  --dsw-alias-state-success-tertiary: #233c2c;
  --dsw-alias-state-warn-primary: #f59e0b;
  --dsw-alias-state-warn-label: #dd8629;
  --dsw-alias-state-warn-tertiary: #27241f;
  --dsw-alias-state-idle-primary: #545557;
  --dsw-alias-state-error-primary: #f25a5a;
  --dsw-radius-sm: 8px;
  --dsw-radius-md: 12px;
}

/* =====================================================================
   1. 原型外壳（模拟 DSH 窗口 / 对话区 / 右侧栏 / 导演台）
   ===================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", sans-serif;
  background: var(--dsw-alias-bg-layer-2);
  color: var(--dsw-alias-label-primary);
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background-color .3s ease;
}
button { font: inherit; }

.pt-bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; }
.pt-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pt-sep { width: 1px; height: 18px; background: var(--dsw-alias-border-l2); }
.pt-btn {
  height: 28px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-secondary); font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: background-color .12s, color .12s, border-color .12s, transform .12s;
}
.pt-btn:hover { color: var(--dsw-alias-label-primary); border-color: var(--dsw-alias-border-l2); }
.pt-btn:active { transform: translateY(1px); }
.pt-btn[aria-pressed="true"] {
  color: var(--dsw-alias-state-business-primary);
  border-color: color-mix(in srgb, var(--dsw-alias-state-business-primary) 40%, transparent);
  background: var(--dsw-alias-state-business-tertiary);
}
.pt-btn--primary { background: var(--dsw-alias-label-primary); color: var(--dsw-alias-bg-base); border-color: transparent; min-width: 76px; justify-content: center; }
.pt-btn--primary:hover { color: var(--dsw-alias-bg-base); opacity: .9; }
.pt-btn svg { width: 12px; height: 12px; }
.pt-btn.is-nope { animation: pt-nope .34s ease; }
@keyframes pt-nope { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }
.pt-step { font: 11px/1 ui-monospace, Menlo, monospace; color: var(--dsw-alias-label-tertiary); min-width: 38px; padding-left: 4px; }
.pt-seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--dsw-alias-bg-layer-1); border: 1px solid var(--dsw-alias-border-l1); }
.pt-seg button {
  height: 24px; padding: 0 9px; border: 0; border-radius: 7px; background: transparent;
  color: var(--dsw-alias-label-tertiary); font-size: 12px; cursor: pointer; transition: color .12s, background-color .12s;
}
.pt-seg button:hover { color: var(--dsw-alias-label-secondary); }
.pt-seg button[aria-pressed="true"] { background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary); box-shadow: 0 0 0 1px var(--dsw-alias-border-l1); }
.pt-readout { font: 11px/1 ui-monospace, Menlo, monospace; color: var(--dsw-alias-label-tertiary); min-width: 46px; }

.pt-stage { flex: 1; min-height: 0; display: flex; padding: 0 16px 16px; }
.app {
  position: relative; flex: 1; min-width: 0; display: flex; overflow: hidden;
  border-radius: 12px; border: 1px solid var(--dsw-alias-border-l2); background: var(--dsw-alias-bg-base);
}
.conv { flex: 1; min-width: 240px; display: flex; flex-direction: column; }
.conv__head {
  flex: none; height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 18px;
  border-bottom: 1px solid var(--dsw-alias-border-l1); font-size: 13px; font-weight: 600;
}
.conv__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dsw-alias-state-business-primary); }
.conv__body { flex: 1; min-height: 0; overflow: auto; padding: 18px 22px 8px; display: flex; flex-direction: column; gap: 9px; }
.msg-user { align-self: flex-end; max-width: 78%; padding: 9px 13px; border-radius: 14px 14px 4px 14px; background: var(--dsw-alias-bg-layer-1); font-size: 13px; line-height: 1.6; }
.msg-agent { font-size: 13px; line-height: 1.7; color: var(--dsw-alias-label-secondary); max-width: 620px; margin-bottom: 4px; }
.call { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; color: var(--dsw-alias-label-tertiary); animation: call-in .32s cubic-bezier(.2,.8,.2,1) both; }
.call svg { width: 12px; height: 12px; flex: none; }
.call code { flex: none; font: 11px/1.6 ui-monospace, Menlo, monospace; color: var(--dsw-alias-label-secondary); background: var(--dsw-alias-bg-layer-1); padding: 1px 6px; border-radius: 5px; }
.call span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { font-size: 12px; color: var(--dsw-alias-label-tertiary); padding: 2px 0 2px 20px; animation: call-in .32s ease both; }
@keyframes call-in { from { opacity: 0; transform: translateY(4px); } }
.conv__input {
  flex: none; margin: 8px 18px 16px; height: 44px; border-radius: 12px; border: 1px solid var(--dsw-alias-border-l2);
  display: flex; align-items: center; padding: 0 14px; color: var(--dsw-alias-label-tertiary); font-size: 13px;
}

.side {
  --side-w: 400px;
  position: relative; flex: none; width: var(--side-w);
  display: flex; flex-direction: column; overflow: hidden;
  border-left: 1px solid var(--dsw-alias-border-l1); background: var(--dsw-alias-bg-base);
  transition: width .42s cubic-bezier(.2,.8,.2,1), opacity .3s ease, transform .3s ease, border-color .3s;
}
.side.is-dragging { transition: none; }
.side[data-geo="dock"] .side__tabs, .side[data-geo="dock"] .side__body { width: calc(var(--side-w) - 1px); }
.side[data-geo="dock"].is-collapsed { width: 0; border-left-color: transparent; }
.side__grip { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 30; }
.side__grip::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--dsw-alias-state-business-primary); opacity: 0; transition: opacity .15s; }
.side__grip:hover::after, .side.is-dragging .side__grip::after { opacity: .6; }
.side__tabs {
  flex: none; height: 40px; display: flex; align-items: center; gap: 2px; padding: 0 8px;
  border-bottom: 1px solid var(--dsw-alias-border-l1); overflow: hidden; user-select: none;
}
.chip {
  position: relative; flex: none; height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px;
  border-radius: 7px; font-size: 12px; color: var(--dsw-alias-label-tertiary); cursor: pointer; white-space: nowrap; overflow: hidden;
  transition: background-color .15s, color .15s;
}
.chip:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-secondary); }
.chip[aria-selected="true"] { background: var(--dsw-alias-interactive-bg-active); color: var(--dsw-alias-label-primary); }
.chip > svg { width: 14px; height: 14px; flex: none; }
.chip[hidden] { display: none; }
.chip__x { flex: none; width: 16px; height: 16px; margin-left: 2px; margin-right: -3px; border-radius: 4px; display: grid; place-items: center; opacity: 0; transition: opacity .12s, background-color .12s; }
.chip__x svg { width: 10px; height: 10px; }
.chip:hover .chip__x, .chip[aria-selected="true"] .chip__x { opacity: .65; }
.chip__x:hover { opacity: 1 !important; background: var(--dsw-alias-interactive-bg-active); }
.side__body { position: relative; flex: 1; min-height: 0; }
.side__pane { position: absolute; inset: 0; overflow: hidden; }

.side[data-geo="float"] {
  position: absolute; right: 24px; top: 24px; width: 600px; height: min(700px, calc(100% - 48px));
  min-width: 300px; min-height: 320px; max-width: calc(100% - 48px); max-height: calc(100% - 48px);
  border: 1px solid var(--dsw-alias-border-l3); border-radius: 14px; resize: both; z-index: 20;
  box-shadow: 0 24px 60px -16px rgba(0, 0, 0, .28);
}
.side[data-geo="float"] .side__grip { display: none; }
.side[data-geo="float"] .side__tabs { cursor: grab; }
.side[data-geo="full"] { position: absolute; inset: 0; width: auto; z-index: 20; border-left: 0; }
.side[data-geo="full"] .side__grip { display: none; }
.side[data-geo="float"].is-collapsed, .side[data-geo="full"].is-collapsed { opacity: 0; transform: scale(.98); pointer-events: none; }

.mock-files { padding: 10px 8px; font-size: 12.5px; color: var(--dsw-alias-label-secondary); }
.mock-files div { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 8px; border-radius: 6px; }
.mock-files div:hover { background: var(--dsw-alias-interactive-bg-hover); }
.mock-files svg { width: 14px; height: 14px; color: var(--dsw-alias-label-tertiary); flex: none; }
.mock-files .in { padding-left: 28px; }
.mock-term { padding: 14px 16px; font: 12px/1.75 ui-monospace, Menlo, monospace; color: var(--dsw-alias-label-secondary); }
.mock-term .ok { color: var(--dsw-alias-state-success-primary); }
.mock-term .dim { color: var(--dsw-alias-label-tertiary); }
.mock-term .cur { display: inline-block; width: 7px; height: 14px; background: currentColor; vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* =====================================================================
   2. 看板插件样式 —— 与正式 client.js 注入的 <style> 一致
      全新高阶动态视觉语言（Hyper-Refined Modern Motion & Living UI）
      规则：只引用 --dsw-alias-* / --dsw-radius-*，派生色一律 color-mix
   ===================================================================== */

.tkb-root, .tkb-title {
  --tkb-d1: calc(140ms * var(--tkb-speed, 1));
  --tkb-d2: calc(240ms * var(--tkb-speed, 1));
  --tkb-d3: calc(480ms * var(--tkb-speed, 1));
  --tkb-ease: cubic-bezier(.2, .8, .2, 1);
  --tkb-ease-spring: cubic-bezier(.34, 1.42, .64, 1);
  --tkb-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --tkb-c-pending: var(--dsw-alias-state-idle-primary);
  --tkb-c-active: var(--dsw-alias-state-business-primary);
  --tkb-c-done: var(--dsw-alias-state-success-primary);
  --tkb-c-warn: var(--dsw-alias-state-warn-primary);
  --tkb-c-error: var(--dsw-alias-state-error-primary);
}
@supports (transition-timing-function: linear(0, 1)) {
  .tkb-root, .tkb-title {
    --tkb-ease-spring: linear(0, .12 4%, .42 11%, .72 20%, .9 29%, .99 38%, 1.03 47%, 1.035 54%, 1.02 64%, 1.005 78%, 1);
  }
}

.tkb-root {
  container: tkb / inline-size;
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  outline: none;
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.tkb-root *, .tkb-root *::before, .tkb-root *::after { box-sizing: border-box; }
.tkb-root svg { display: block; flex: none; }
.tkb-root [hidden] { display: none !important; }
.tkb-sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* =====================================================================
   状态图标族与动效
   ===================================================================== */
.tkb-glyph { width: 12px; height: 12px; }
.tkb-glyph--pending { color: var(--tkb-c-pending); }
.tkb-glyph--in_progress { color: var(--tkb-c-active); }
.tkb-glyph--completed { color: color-mix(in srgb, var(--tkb-c-done) 80%, var(--dsw-alias-label-primary)); }
.tkb-glyph--completed circle {
  stroke: color-mix(in srgb, var(--tkb-c-done) 60%, var(--dsw-alias-label-primary));
  stroke-width: 0.8;
}
.tkb-glyph__check {
  stroke: var(--dsw-alias-bg-base);
  stroke-dasharray: 10;
  stroke-dashoffset: 0;
}

/* 原型专属数字逐位滚动定位约束 */
.tkb-roll { display: inline-flex; align-items: center; font-variant-numeric: tabular-nums; }
.tkb-roll__c { position: relative; display: inline-block; height: 1.15em; overflow: hidden; line-height: 1.15em; vertical-align: top; }
.tkb-roll__in { display: inline-block; }
.tkb-roll__out { position: absolute; left: 0; top: 0; }

/* =====================================================================
   顶部全局状态条（Omni Header & Quantum Fuel Strip）
   ===================================================================== */
.tkb-head {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 12px 14px 11px;
  border-bottom: 1px solid var(--dsw-alias-border-l1);
  background: var(--dsw-alias-bg-base);
  transition: background-color var(--tkb-d3) var(--tkb-ease);
}
.tkb-score {
  flex: none;
  display: inline-flex;
  align-items: baseline;
  gap: 1px;
  cursor: default;
}
.tkb-score__done {
  position: relative;
  display: inline-flex;
  overflow: hidden;
  height: 22px;
  line-height: 22px;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  transition: color var(--tkb-d3) var(--tkb-ease);
}
.tkb-odo {
  display: inline-flex;
  flex-direction: column;
  transition: transform 340ms ease-out;
  transition: transform 380ms linear(0, .14 5%, .48 13%, .78 23%, .95 34%, 1.03 48%, 1.01 68%, 1);
}
.tkb-odo span {
  height: 22px;
  line-height: 22px;
  display: block;
  text-align: center;
}
.tkb-score__total {
  font-size: 12px;
  font-weight: 500;
  color: var(--dsw-alias-label-tertiary);
  padding-bottom: 2px;
  font-variant-numeric: tabular-nums;
}
.tkb-root[data-alldone] .tkb-score__done {
  color: var(--tkb-c-done);
}

/* 顶部进度条（校准游标槽） */
.tkb-strip {
  position: relative;
  flex: 1 1 auto;
  min-width: 48px;
  height: 12px;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px 3px;
  border-radius: 6px;
  overflow: hidden;
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 4%, var(--dsw-alias-bg-base));
  border: 1px solid var(--dsw-alias-border-l2);
  box-shadow: inset 0 1px 2px color-mix(in srgb, var(--dsw-alias-label-primary) 8%, transparent);
}
.tkb-root[data-alldone] .tkb-strip::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--tkb-c-done) 45%, var(--dsw-alias-label-on-color)), transparent);
  transform: translateX(-100%);
  animation: tkb-alldone-sweep 900ms var(--tkb-ease) 1;
  pointer-events: none;
}
.tkb-slot {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: 0;
  display: flex;
  align-items: center;
  background: transparent;
  cursor: pointer;
  border-radius: 3px;
  appearance: none;
  transition: flex-grow var(--tkb-d3) var(--tkb-ease);
}
.tkb-slot::before {
  content: "";
  position: absolute;
  top: -9px;
  bottom: -9px;
  left: -1px;
  right: -1px;
  pointer-events: auto;
}
.tkb-slot__bar {
  position: relative;
  width: 100%;
  height: 6px;
  border-radius: 2px;
  overflow: hidden;
  background-color: color-mix(in srgb, var(--dsw-alias-label-primary) 8%, transparent);
  transition: height var(--tkb-d2) var(--tkb-ease),
              background-color var(--tkb-d3) var(--tkb-ease),
              transform var(--tkb-d1) var(--tkb-ease),
              box-shadow var(--tkb-d2) var(--tkb-ease);
}
.tkb-slot:hover .tkb-slot__bar {
  transform: scaleY(1.3);
  box-shadow: 0 0 4px color-mix(in srgb, var(--tkb-c-active) 35%, transparent);
}
.tkb-slot[data-s="blocked"] .tkb-slot__bar {
  background-color: color-mix(in srgb, var(--tkb-c-warn) 22%, transparent);
  background-image: repeating-linear-gradient(
    -45deg,
    color-mix(in srgb, var(--tkb-c-warn) 50%, transparent) 0 3px,
    color-mix(in srgb, var(--tkb-c-warn) 18%, transparent) 3px 6px
  );
}
.tkb-slot[data-s="ready"] .tkb-slot__bar {
  background-color: transparent;
  box-shadow: inset 0 0 0 1.2px color-mix(in srgb, var(--tkb-c-active) 55%, transparent);
}
.tkb-slot[data-s="active"] .tkb-slot__bar {
  background: var(--tkb-c-active);
  box-shadow: 0 0 6px color-mix(in srgb, var(--tkb-c-active) 40%, transparent);
}
.tkb-slot[data-s="done"] .tkb-slot__bar {
  height: 4px;
  background-color: var(--tkb-c-done);
}
.tkb-slot[data-s="done"]:hover .tkb-slot__bar {
  box-shadow: 0 0 4px color-mix(in srgb, var(--tkb-c-done) 40%, transparent);
}

/* =====================================================================
   智能体指挥官视窗 (Agent Cockpit Strip)
   ===================================================================== */
.tkb-mates-wrap {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  min-width: 0;
  max-width: calc(100% - 140px);
}
.tkb-mates {
  flex: none;
  display: flex;
  align-items: center;
  padding-left: 4px;
  min-width: 0;
  max-width: 100%;
  overflow: clip;
  overflow-clip-margin: 8px;
}
.tkb-mates[data-overflow] {
  -webkit-mask-image: linear-gradient(to right, var(--dsw-alias-label-primary) calc(100% - 18px), transparent 100%);
  mask-image: linear-gradient(to right, var(--dsw-alias-label-primary) calc(100% - 18px), transparent 100%);
}
.tkb-mates__more {
  flex: none;
  height: 22px;
  padding: 0 6px;
  margin-left: 2px;
  border-radius: 11px;
  border: 1px solid var(--dsw-alias-border-l2);
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-secondary);
  font-family: var(--tkb-mono);
  font-size: 10.5px;
  font-weight: 600;
  cursor: pointer;
  appearance: none;
  transition: background-color var(--tkb-d1) var(--tkb-ease), color var(--tkb-d1) var(--tkb-ease), transform var(--tkb-d1) var(--tkb-ease);
}
.tkb-mates__more:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}
.tkb-mates__more:active { transform: scale(0.95); }
.tkb-mates__empty {
  font-size: 11px;
  color: var(--dsw-alias-label-tertiary);
  white-space: nowrap;
}

/* =====================================================================
   团队控制（本插件唯一的写入口：停用团队协作）
   ===================================================================== */
.tkb-team {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  padding-left: 8px;
  border-left: 1px solid var(--dsw-alias-border-l2);
}
.tkb-team__btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 8px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 11px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font: inherit;
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
  appearance: none;
  transition: background-color var(--tkb-d2) var(--tkb-ease),
              border-color var(--tkb-d2) var(--tkb-ease),
              color var(--tkb-d2) var(--tkb-ease);
}
.tkb-team__btn:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}
.tkb-team__btn:focus-visible {
  outline: 2px solid var(--dsw-alias-state-business-primary);
  outline-offset: 2px;
}
.tkb-team__btn[aria-expanded="true"] {
  border-color: var(--dsw-alias-border-l3);
  color: var(--dsw-alias-label-primary);
}
.tkb-team__icon { display: block; flex: none; color: currentColor; }
.tkb-team__label { white-space: nowrap; }
.tkb-team__pop {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 6;
  width: 232px;
  padding: 12px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-2);
  box-shadow: 0 12px 32px color-mix(in srgb, var(--dsw-alias-label-primary) 18%, transparent);
  transform-origin: top right;
  animation: tkb-pop-in 180ms ease-out both;
  animation: tkb-pop-in 260ms linear(0, .45 18%, 1.04 48%, .99 72%, 1) both;
}
.tkb-team__title {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--dsw-alias-label-primary);
}
.tkb-team__body {
  margin: 0 0 10px;
  font-size: 11px;
  line-height: 1.5;
  color: var(--dsw-alias-label-secondary);
}
.tkb-team__err {
  margin: 0 0 8px;
  font-size: 11px;
  line-height: 1.4;
  color: var(--dsw-alias-state-error-primary);
}
.tkb-team__actions { display: flex; justify-content: flex-end; gap: 6px; }
.tkb-team__ghost,
.tkb-team__danger {
  height: 24px;
  padding: 0 10px;
  border-radius: 6px;
  font: inherit;
  font-size: 11px;
  cursor: pointer;
  appearance: none;
}
.tkb-team__ghost {
  border: 1px solid var(--dsw-alias-border-l2);
  background: transparent;
  color: var(--dsw-alias-label-secondary);
}
.tkb-team__ghost:hover { background: var(--dsw-alias-interactive-bg-hover); }
.tkb-team__danger {
  border: 1px solid var(--dsw-alias-state-error-primary);
  background: transparent;
  color: color-mix(in srgb, var(--dsw-alias-state-error-primary) 85%, var(--dsw-alias-label-primary));
}
.tkb-team__danger:hover {
  background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 12%, transparent);
}
.tkb-team__ghost:disabled,
.tkb-team__danger:disabled { opacity: .55; cursor: default; }
@keyframes tkb-pop-in {
  from { opacity: 0; transform: translateY(-4px) scale(.98); }
  to { opacity: 1; transform: none; }
}
@container tkb (max-width: 520px) {
  .tkb-head { gap: 8px; padding: 10px 12px 9px; }
  .tkb-team { padding-left: 6px; }
  .tkb-team__label { display: none; }
  .tkb-team__btn { padding: 0 6px; }
  .tkb-mates-wrap { max-width: calc(100% - 156px); }
  .tkb-mc + .tkb-mc { margin-left: 5px; }
}
.tkb-mc {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  border: 0;
  border-radius: 14px;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
  transition: opacity var(--tkb-d2) var(--tkb-ease),
              background-color var(--tkb-d2) var(--tkb-ease),
              transform var(--tkb-d1) var(--tkb-ease);
}
.tkb-mc + .tkb-mc { margin-left: 8px; }
.tkb-mc:hover { z-index: 3; }
.tkb-mc:hover .tkb-mate {
  transform: translateY(-2px) scale(1.06);
  box-shadow: 0 4px 12px color-mix(in srgb, var(--dsw-alias-label-primary) 12%, transparent);
}
.tkb-mc__name {
  display: none;
  max-width: 12ch;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12px;
  color: var(--dsw-alias-label-secondary);
  white-space: nowrap;
}
.tkb-root[data-spot] .tkb-mc:not(.is-spot) { opacity: .35; filter: saturate(0.6); }
.tkb-mc.is-pinned {
  padding: 2px 8px 2px 2px;
  background: color-mix(in srgb, var(--tkb-c-active) 10%, var(--dsw-alias-bg-base));
}
.tkb-mc.is-pinned .tkb-mc__name {
  display: inline;
  max-width: 9ch;
  color: var(--dsw-alias-label-primary);
  font-weight: 500;
}
.tkb-mc.is-pinned .tkb-mate {
  background: color-mix(in srgb, var(--tkb-c-active) 25%, var(--dsw-alias-bg-layer-2));
  color: var(--tkb-c-active);
  box-shadow: 0 0 0 2px var(--tkb-c-active), 0 4px 12px color-mix(in srgb, var(--tkb-c-active) 35%, transparent);
}

.tkb-mate {
  position: relative;
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  user-select: none;
  font-size: 11px;
  font-weight: 700;
  color: var(--dsw-alias-label-secondary);
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 6%, var(--dsw-alias-bg-base));
  box-shadow: 0 0 0 2px var(--dsw-alias-bg-base);
  border: 0;
  padding: 0;
  font-family: inherit;
  transition: transform var(--tkb-d1) var(--tkb-ease),
              opacity var(--tkb-d2) var(--tkb-ease),
              background-color var(--tkb-d2),
              color var(--tkb-d2),
              box-shadow var(--tkb-d2);
}
.tkb-mate[data-wide] { font-size: 9.5px; letter-spacing: -.04em; }
.tkb-mate[data-lead] {
  border-radius: 7px;
  background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 12%, var(--dsw-alias-bg-layer-2));
  color: color-mix(in srgb, var(--dsw-alias-state-business-primary) 70%, var(--dsw-alias-label-primary));
}
.tkb-mate[data-running] {
  box-shadow: 0 0 0 2px var(--dsw-alias-bg-base), 0 0 0 3px color-mix(in srgb, var(--tkb-c-active) 65%, transparent);
}
.tkb-mate[data-phase="failed"] {
  box-shadow: 0 0 0 2px var(--dsw-alias-bg-base), 0 0 0 3px color-mix(in srgb, var(--tkb-c-error) 55%, transparent);
  color: color-mix(in srgb, var(--tkb-c-error) 80%, var(--dsw-alias-label-primary));
}
.tkb-mate[data-none] {
  background: transparent;
  box-shadow: none;
  border: 1px dashed var(--dsw-alias-border-l3);
  color: var(--dsw-alias-label-tertiary);
  cursor: default;
}
.tkb-mate__dot {
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--dsw-alias-state-idle-primary);
  box-shadow: 0 0 0 2px var(--dsw-alias-bg-base);
  transition: background-color var(--tkb-d2), transform var(--tkb-d1);
}
.tkb-mate[data-running] .tkb-mate__dot {
  background: var(--tkb-c-active);
  box-shadow: 0 0 6px var(--tkb-c-active), 0 0 0 2px var(--dsw-alias-bg-base);
  animation: tkb-blink calc(1400ms * var(--tkb-speed, 1)) ease-in-out infinite;
}
.tkb-mate[data-phase="failed"] .tkb-mate__dot {
  background: var(--tkb-c-error);
}
.tkb-mate[data-phase="provisioning"] .tkb-mate__dot {
  background: var(--tkb-c-warn);
  animation: tkb-blink calc(1400ms * var(--tkb-speed, 1)) ease-in-out infinite;
}

/* =====================================================================
   异常横幅
   ===================================================================== */
.tkb-banner {
  flex: none;
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--tkb-d3) var(--tkb-ease);
}
.tkb-banner[data-open] { grid-template-rows: 1fr; }
.tkb-banner__clip { min-height: 0; overflow: hidden; }
.tkb-banner__box {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 10px 10px 2px;
  padding: 8px 10px;
  border-radius: var(--dsw-radius-md);
  font-size: 12px;
  color: var(--tkb-c-error);
  background: color-mix(in srgb, var(--tkb-c-error) 8%, var(--dsw-alias-bg-base));
  border: 1px solid color-mix(in srgb, var(--tkb-c-error) 22%, transparent);
}
.tkb-banner__icon { width: 14px; height: 14px; margin-top: 1px; }
.tkb-banner__text { min-width: 0; }
.tkb-banner__title { font-weight: 600; }
.tkb-banner__msg {
  margin-top: 2px;
  font-family: var(--tkb-mono);
  font-size: 11px;
  color: var(--dsw-alias-label-secondary);
  overflow-wrap: anywhere;
}

/* =====================================================================
   泳道与容器
   ===================================================================== */
.tkb-lanes {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--dsw-alias-border-l3) transparent;
}
.tkb-lane { position: relative; }
.tkb-lane__head {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 7px;
  height: 36px;
  padding: 0 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--dsw-alias-label-secondary);
  background: color-mix(in srgb, var(--dsw-alias-bg-base) 80%, transparent);
  -webkit-backdrop-filter: blur(12px) saturate(1.5);
  backdrop-filter: blur(12px) saturate(1.5);
  border-bottom: 1px solid color-mix(in srgb, var(--dsw-alias-border-l1) 40%, transparent);
  transition: color var(--tkb-d1) var(--tkb-ease);
}
.tkb-lane__head[role="button"] { cursor: pointer; user-select: none; }
.tkb-lane__head[role="button"]:hover { color: var(--dsw-alias-label-primary); }
.tkb-lane__head:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--tkb-c-active) 60%, transparent);
  outline-offset: -2px;
}
.tkb-lane__name { white-space: nowrap; }
.tkb-lane__count {
  margin-left: auto;
  min-width: 20px;
  height: 18px;
  padding: 0 6px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--dsw-alias-label-secondary);
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 5%, var(--dsw-alias-bg-base));
  box-shadow: inset 0 0 0 1px var(--dsw-alias-border-l1);
  font-variant-numeric: tabular-nums;
  transition: color var(--tkb-d2);
}
.tkb-lane__chev {
  width: 12px;
  height: 12px;
  color: var(--dsw-alias-label-tertiary);
  transition: transform var(--tkb-d2) var(--tkb-ease), color var(--tkb-d1);
}
.tkb-lane__head:hover .tkb-lane__chev { color: var(--dsw-alias-label-secondary); }
.tkb-lane[data-collapsed] .tkb-lane__chev { transform: rotate(-90deg); }
.tkb-lane[data-collapsed] .tkb-lane__body { display: none !important; }
.tkb-lane[data-empty] .tkb-lane__head { height: 30px; color: var(--dsw-alias-label-tertiary); }
.tkb-lane[data-empty] .tkb-lane__count { opacity: .55; }
.tkb-lane[data-empty] .tkb-lane__body { display: none; }
.tkb-lane__body {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 4px 10px 14px;
}
.tkb-lane[data-lane="completed"] .tkb-lane__body { gap: 2px; }
.tkb-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 42px;
  border: 1px dashed var(--dsw-alias-border-l2);
  border-radius: var(--dsw-radius-md);
  color: var(--dsw-alias-label-tertiary);
  font-size: 12px;
}
.tkb-divider {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 18px;
  margin: 3px 2px 1px;
  color: var(--dsw-alias-label-tertiary);
}
.tkb-divider::before, .tkb-divider::after {
  content: "";
  flex: 1;
  border-top: 1px dashed var(--dsw-alias-border-l2);
}
.tkb-divider svg { width: 12px; height: 12px; opacity: .85; }

/* =====================================================================
   卡片体系：空间景深与高阶微物理（Spatial Card Physics）
   ===================================================================== */
.tkb-card {
  position: relative;
  display: grid;
  align-items: center;
  column-gap: 8px;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas:
    "id deps owner"
    "title title title"
    "preview preview preview"
    "detail detail detail";
  padding: 9px 11px 10px 12px;
  border-radius: var(--dsw-radius-md);
  border: 1px solid var(--dsw-alias-border-l1);
  background: var(--dsw-alias-card-fill);
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--dsw-alias-label-on-color) 10%, transparent),
              0 1px 2px color-mix(in srgb, var(--dsw-alias-label-primary) 6%, transparent),
              0 4px 10px -4px color-mix(in srgb, var(--dsw-alias-label-primary) 5%, transparent);
  transition: transform var(--tkb-d2) var(--tkb-ease),
              box-shadow var(--tkb-d2) var(--tkb-ease),
              background-color var(--tkb-d1) var(--tkb-ease),
              border-color var(--tkb-d2) var(--tkb-ease),
              opacity var(--tkb-d2) var(--tkb-ease);
}
.tkb-card:hover {
  transform: translateY(-2px);
  background: var(--dsw-alias-card-fill-hover);
  border-color: color-mix(in srgb, var(--dsw-alias-border-l2) 80%, transparent);
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--dsw-alias-label-on-color) 12%, transparent),
              0 8px 20px -3px color-mix(in srgb, var(--dsw-alias-label-primary) 10%, transparent),
              0 2px 6px -1px color-mix(in srgb, var(--dsw-alias-label-primary) 6%, transparent);
}
.tkb-card:active {
  transform: translateY(0) scale(0.992);
  box-shadow: 0 1px 2px color-mix(in srgb, var(--dsw-alias-label-primary) 8%, transparent);
  transition-duration: 70ms;
}
.tkb-card[data-expanded] {
  z-index: 3;
  border-color: color-mix(in srgb, var(--tkb-c-active) 48%, var(--dsw-alias-border-l2));
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--tkb-c-active) 16%, transparent),
              0 10px 26px -6px color-mix(in srgb, var(--dsw-alias-label-primary) 14%, transparent),
              0 0 0 1px color-mix(in srgb, var(--tkb-c-active) 18%, transparent);
}
.tkb-card__hit {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: inherit;
  background: transparent;
  cursor: pointer;
  appearance: none;
}
.tkb-card__hit:focus-visible { outline: none; }
.tkb-card:focus-within {
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--tkb-c-active) 60%, transparent),
              0 6px 18px -2px color-mix(in srgb, var(--tkb-c-active) 20%, transparent);
}
.tkb-card > :not(.tkb-card__hit):not(.tkb-card__rail):not(.tkb-card__detail) {
  position: relative;
  z-index: 1;
  pointer-events: none;
}
.tkb-card button { pointer-events: auto; }

.tkb-card__glyph { grid-area: glyph; display: none; }
.tkb-card__id {
  grid-area: id;
  font-family: var(--tkb-mono);
  font-size: 11px;
  color: var(--dsw-alias-label-tertiary);
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tkb-card__deps {
  grid-area: deps;
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  overflow: hidden;
}
.tkb-card__deps-arrow {
  width: 11px;
  height: 11px;
  margin-right: 1px;
  color: var(--dsw-alias-label-tertiary);
}
.tkb-card__owner {
  grid-area: owner;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  min-height: 20px;
  justify-self: end;
}
.tkb-card__owner-name {
  display: none;
  max-width: 11ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11.5px;
  color: var(--dsw-alias-label-tertiary);
}
.tkb-card[data-status="in_progress"] .tkb-card__owner-name {
  display: inline;
  color: var(--dsw-alias-label-secondary);
  font-weight: 500;
}
.tkb-card__owner .tkb-mate {
  width: 20px;
  height: 20px;
  font-size: 10px;
  box-shadow: none;
}
.tkb-card__owner .tkb-mate[data-wide] { font-size: 8.5px; }
.tkb-card__owner .tkb-mate[data-lead] { border-radius: 6px; }
.tkb-card__owner .tkb-mate__dot { right: -2px; bottom: -2px; width: 6px; height: 6px; box-shadow: none; }
.tkb-card__chev {
  width: 11px;
  height: 11px;
  color: var(--dsw-alias-label-tertiary);
  opacity: 0;
  transition: opacity var(--tkb-d1) var(--tkb-ease), transform var(--tkb-d2) var(--tkb-ease);
}
.tkb-card:hover .tkb-card__chev,
.tkb-card:focus-within .tkb-card__chev { opacity: .55; }
@media (hover: none) {
  .tkb-card__chev { opacity: .55; }
}
.tkb-card[data-expanded] .tkb-card__chev { opacity: .8; transform: rotate(180deg); }

/* 活跃运行指示器 */
.tkb-card__live-dot {
  position: relative;
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--tkb-c-active);
  box-shadow: 0 0 8px var(--tkb-c-active);
}

.tkb-card__title {
  grid-area: title;
  margin-top: 4px;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.44;
  color: var(--dsw-alias-label-primary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
  text-wrap: pretty;
  transition: color var(--tkb-d2) var(--tkb-ease);
}
.tkb-card[data-expanded] .tkb-card__title { -webkit-line-clamp: unset; }
.tkb-card__preview { grid-area: preview; display: none; }
.tkb-card__detail {
  grid-area: detail;
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-rows: 0fr;
  pointer-events: auto;
  cursor: auto;
  transition: grid-template-rows var(--tkb-d2) var(--tkb-ease);
}
.tkb-card[data-expanded] .tkb-card__detail { grid-template-rows: 1fr; }
.tkb-card__detail-clip {
  min-height: 0;
  overflow: hidden;
  visibility: hidden;
  opacity: 0;
  transition: opacity var(--tkb-d1) var(--tkb-ease), visibility 0ms var(--tkb-d2);
}
.tkb-card[data-expanded] .tkb-card__detail-clip {
  visibility: visible;
  opacity: 1;
  transition: opacity var(--tkb-d2) var(--tkb-ease), visibility 0ms;
}

/* ---------------------------------------------------------------------
   状态 1：待处理（Pending）—— 阻塞暗哑 vs 就绪轻盈
   --------------------------------------------------------------------- */
.tkb-card[data-status="pending"][data-ready="false"] {
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 2.2%, var(--dsw-alias-bg-base));
  border-style: dashed;
  border-color: var(--dsw-alias-border-l2);
  box-shadow: inset 0 1px 3px color-mix(in srgb, var(--dsw-alias-label-primary) 7%, transparent);
}
.tkb-card[data-status="pending"][data-ready="false"]:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  border-color: var(--dsw-alias-border-l3);
}
.tkb-card[data-status="pending"][data-ready="false"] .tkb-card__title {
  color: var(--dsw-alias-label-secondary);
}

/* 就绪卡片：DSH 科技蓝微边框与轻微提升 */
.tkb-card[data-status="pending"][data-ready="true"] {
  border-color: color-mix(in srgb, var(--tkb-c-active) 28%, var(--dsw-alias-border-l1));
}
.tkb-card[data-status="pending"][data-ready="true"]:hover {
  border-color: color-mix(in srgb, var(--tkb-c-active) 45%, var(--dsw-alias-border-l2));
  box-shadow: 0 3px 10px -2px color-mix(in srgb, var(--tkb-c-active) 12%, transparent);
}

/* ---------------------------------------------------------------------
   状态 2：进行中（In Progress）—— DSH 科技蓝纯净质感与低噪呼吸
   --------------------------------------------------------------------- */
.tkb-card[data-status="in_progress"] {
  padding-left: 15px;
  background: color-mix(in srgb, var(--dsw-alias-state-business-tertiary) 18%, var(--dsw-alias-card-fill));
  border-color: color-mix(in srgb, var(--tkb-c-active) 36%, var(--dsw-alias-border-l1));
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--tkb-c-active) 18%, transparent),
              0 4px 14px -4px color-mix(in srgb, var(--tkb-c-active) 18%, transparent),
              0 1px 2px color-mix(in srgb, var(--dsw-alias-label-primary) 6%, transparent);
}
.tkb-card[data-status="in_progress"][data-live] {
  animation: tkb-breath calc(2800ms * var(--tkb-speed, 1)) ease-in-out infinite;
}
.tkb-card[data-status="in_progress"]:hover {
  background: color-mix(in srgb, var(--dsw-alias-state-business-tertiary) 28%, var(--dsw-alias-card-fill-hover));
  border-color: color-mix(in srgb, var(--tkb-c-active) 52%, var(--dsw-alias-border-l2));
  box-shadow: 0 4px 14px -2px color-mix(in srgb, var(--tkb-c-active) 18%, transparent);
}

/* 左侧内嵌式圆角能量槽 */
.tkb-card__rail {
  position: absolute;
  left: 5px;
  top: 10px;
  bottom: 10px;
  width: 3px;
  border-radius: 3px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  background: color-mix(in srgb, var(--tkb-c-active) 40%, transparent);
  transition: opacity var(--tkb-d3) var(--tkb-ease), background-color var(--tkb-d3) var(--tkb-ease);
}
.tkb-card[data-status="in_progress"] .tkb-card__rail { opacity: 1; }
.tkb-card[data-status="in_progress"][data-live] .tkb-card__rail {
  background: var(--tkb-c-active);
  box-shadow: 0 0 6px var(--tkb-c-active);
}
.tkb-card__rail::after {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0; height: 60%;
  opacity: 0;
  background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--tkb-c-active) 35%, var(--dsw-alias-label-on-color)) 50%, transparent);
  transform: translateY(-100%);
  transition: opacity var(--tkb-d3) var(--tkb-ease);
}
.tkb-card[data-live] .tkb-card__rail::after {
  opacity: 0.8;
  animation: tkb-flow calc(1800ms * var(--tkb-speed, 1)) cubic-bezier(.45, 0, .55, 1) infinite;
}

/* ---------------------------------------------------------------------
   状态 3：已完成（Completed）—— 紧凑通透，自然退入背景
   --------------------------------------------------------------------- */
.tkb-card[data-status="completed"] {
  grid-template-columns: auto auto minmax(0, 1fr) auto;
  grid-template-areas:
    "glyph id title owner"
    "detail detail detail detail";
  padding: 6px 9px 6px 11px;
  background: color-mix(in srgb, var(--dsw-alias-card-fill) 60%, transparent);
  border-color: color-mix(in srgb, var(--dsw-alias-border-l2) 40%, transparent);
  box-shadow: none;
  position: relative;
}
.tkb-card[data-status="completed"]:hover {
  background: var(--dsw-alias-card-fill-hover);
  border-color: var(--dsw-alias-border-l2);
  transform: translateY(-1px);
}
.tkb-card[data-status="completed"][data-expanded] {
  background: var(--dsw-alias-bg-layer-1);
  border-color: var(--dsw-alias-border-l2);
}
.tkb-card[data-status="completed"] .tkb-card__glyph { display: block; }
.tkb-card[data-status="completed"] .tkb-glyph--completed {
  color: color-mix(in srgb, var(--tkb-c-done) 80%, var(--dsw-alias-label-primary));
}

.tkb-card[data-status="completed"] .tkb-card__deps,
.tkb-card[data-status="completed"] .tkb-card__preview,
.tkb-card[data-status="completed"] .tkb-card__owner-name { display: none !important; }
.tkb-card[data-status="completed"] .tkb-card__title {
  margin-top: 0;
  font-size: 12.5px;
  font-weight: 400;
  color: var(--dsw-alias-label-secondary);
  -webkit-line-clamp: 1;
}
.tkb-card[data-status="completed"][data-expanded] .tkb-card__title {
  -webkit-line-clamp: unset;
  color: var(--dsw-alias-label-primary);
}
.tkb-card[data-status="completed"] .tkb-card__owner .tkb-mate {
  width: 18px;
  height: 18px;
  font-size: 9.5px;
}

/* =====================================================================
   依赖徽章与链接胶囊
   ===================================================================== */
.tkb-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  border-radius: 5px;
  font-size: 10.5px;
  font-weight: 600;
  white-space: nowrap;
  transition: transform var(--tkb-d1), box-shadow var(--tkb-d2);
}
.tkb-badge[data-kind="ready"] {
  color: color-mix(in srgb, var(--tkb-c-active) 75%, var(--dsw-alias-label-primary));
  background: var(--dsw-alias-state-business-tertiary);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--tkb-c-active) 24%, transparent);
}
.tkb-badge[data-kind="blocked"] {
  color: color-mix(in srgb, var(--dsw-alias-state-warn-label) 60%, var(--dsw-alias-label-primary));
  background: var(--dsw-alias-state-warn-tertiary);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--tkb-c-warn) 20%, transparent);
}
.tkb-dep {
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  border: 0;
  border-radius: 5px;
  font-family: var(--tkb-mono);
  font-size: 10.5px;
  cursor: pointer;
  white-space: nowrap;
  color: color-mix(in srgb, var(--dsw-alias-state-warn-label) 60%, var(--dsw-alias-label-primary));
  background: var(--dsw-alias-state-warn-tertiary);
  transition: transform var(--tkb-d1), background-color var(--tkb-d1);
}
.tkb-dep::after {
  content: "";
  position: absolute;
  left: 4px; right: 4px; top: 50%; height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform var(--tkb-d3) var(--tkb-ease);
}
.tkb-dep[data-done] {
  color: var(--dsw-alias-label-tertiary);
  background: transparent;
}
.tkb-dep[data-done]::after { transform: scaleX(1); }
.tkb-dep:hover {
  transform: scale(1.06);
  background: color-mix(in srgb, var(--tkb-c-warn) 25%, transparent);
}
.tkb-dep[data-done]:hover {
  background: var(--dsw-alias-interactive-bg-hover);
}
.tkb-unlocks {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  height: 18px;
  padding: 0 5px;
  border-radius: 5px;
  pointer-events: auto;
  font-family: var(--tkb-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--dsw-alias-label-secondary);
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 6%, var(--dsw-alias-bg-base));
}
.tkb-unlocks[data-critical] {
  color: color-mix(in srgb, var(--tkb-c-active) 75%, var(--dsw-alias-label-primary));
  background: var(--dsw-alias-state-business-tertiary);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--tkb-c-active) 32%, transparent);
}
.tkb-unlocks__icon { width: 10px; height: 10px; opacity: .8; }
.tkb-conflict {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 5px;
  pointer-events: auto;
  color: color-mix(in srgb, var(--dsw-alias-state-warn-label) 60%, var(--dsw-alias-label-primary));
  background: var(--dsw-alias-state-warn-tertiary);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--tkb-c-warn) 22%, transparent);
}
.tkb-conflict__icon { width: 11px; height: 11px; }

/* =====================================================================
   展开抽屉（Drawer Physics）
   ===================================================================== */
.tkb-detail {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--dsw-alias-border-l1);
}
.tkb-detail__desc {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.62;
  color: var(--dsw-alias-label-secondary);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: text;
}
.tkb-detail__row {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  column-gap: 4px;
  align-items: start;
}
.tkb-detail__items { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.tkb-detail__icw {
  flex: none;
  width: 18px;
  height: 22px;
  display: grid;
  place-items: center;
  color: var(--dsw-alias-label-tertiary);
}
.tkb-detail__icw svg { width: 12px; height: 12px; }
.tkb-ref {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  max-width: 100%;
  height: 22px;
  padding: 0 8px 0 6px;
  border: 1px solid var(--dsw-alias-border-l1);
  border-radius: 6px;
  background: color-mix(in srgb, var(--dsw-alias-label-primary) 4.5%, var(--dsw-alias-bg-base));
  color: var(--dsw-alias-label-secondary);
  font-family: inherit;
  font-size: 11.5px;
  cursor: pointer;
  transition: transform var(--tkb-d1), background-color var(--tkb-d1), color var(--tkb-d1);
}
.tkb-ref:hover {
  transform: translateY(-1px);
  background: var(--dsw-alias-interactive-bg-active);
  color: var(--dsw-alias-label-primary);
}
.tkb-ref:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--tkb-c-active) 60%, transparent);
  outline-offset: 1px;
}
.tkb-ref .tkb-glyph { width: 10px; height: 10px; }
.tkb-ref__id { font-family: var(--tkb-mono); font-size: 10.5px; color: var(--dsw-alias-label-tertiary); }
.tkb-ref__t {
  min-width: 0;
  max-width: 22ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tkb-scope {
  display: inline-flex;
  align-items: center;
  max-width: 100%;
  height: 20px;
  padding: 0 7px;
  border-radius: 5px;
  border: 1px solid var(--dsw-alias-border-l2);
  font-family: var(--tkb-mono);
  font-size: 10.5px;
  color: var(--dsw-alias-label-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tkb-warnline {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 6px 8px;
  border-radius: var(--dsw-radius-sm);
  border-left: 2.5px solid var(--tkb-c-warn);
  background: var(--dsw-alias-state-warn-tertiary);
  color: var(--dsw-alias-state-warn-label);
  font-size: 11.5px;
  line-height: 1.5;
}
.tkb-warnline svg { width: 13px; height: 13px; margin-top: 2px; }

/* =====================================================================
   神经网络血缘与聚焦矩阵（免除 blur 离屏卷积开销，保持字体锐利）
   ===================================================================== */
/* 队友聚光灯 */
.tkb-root[data-spot] .tkb-card:not(.is-spot) {
  opacity: .32;
  filter: saturate(0.65);
  transform: scale(0.99);
}
.tkb-card.is-spot {
  z-index: 2;
  transform: translateY(-2px);
  border-color: var(--tkb-c-active);
  box-shadow: 0 4px 16px -2px color-mix(in srgb, var(--tkb-c-active) 24%, transparent),
              0 0 0 1px var(--tkb-c-active);
}

/* 依赖血缘链路悬停 */
.tkb-root[data-lineage] .tkb-card:not(.is-lin) {
  opacity: .36;
  filter: saturate(0.7);
  transform: scale(0.99);
}
.tkb-root[data-lineage] .tkb-card.is-lin {
  z-index: 2;
  transform: translateY(-1.5px);
  box-shadow: 0 4px 14px -2px color-mix(in srgb, var(--dsw-alias-label-primary) 10%, transparent);
}
/* 上游卡片（前置供给者）：警示橙微边框与浅底 / 翡翠绿完成底 */
.tkb-root[data-lineage] .tkb-card.is-up-open {
  border-color: var(--tkb-c-warn);
  background: color-mix(in srgb, var(--dsw-alias-state-warn-tertiary) 45%, var(--dsw-alias-card-fill));
  box-shadow: 0 2px 8px color-mix(in srgb, var(--tkb-c-warn) 15%, transparent);
}
.tkb-root[data-lineage] .tkb-card.is-up-done {
  border-color: var(--tkb-c-done);
  background: color-mix(in srgb, var(--tkb-c-done) 10%, var(--dsw-alias-card-fill));
  box-shadow: 0 2px 8px color-mix(in srgb, var(--tkb-c-done) 15%, transparent);
}
/* 下游卡片（后置消费端）：DSH 科技蓝微边框与浅蓝底 */
.tkb-root[data-lineage] .tkb-card.is-down {
  border-color: var(--tkb-c-active);
  background: color-mix(in srgb, var(--dsw-alias-state-business-tertiary) 45%, var(--dsw-alias-card-fill));
  box-shadow: 0 2px 8px color-mix(in srgb, var(--tkb-c-active) 18%, transparent);
}

/* 卡片跳转高亮、冲突成对高亮、解扣脉冲与贝塞尔血缘连线 / 飞行层 */
.tkb-card.is-flash { animation: tkb-flash 1100ms var(--tkb-ease) 1; }
.tkb-card.is-unlocked { animation: tkb-unlock-pulse 640ms var(--tkb-ease) 1; }
.tkb-card.is-landed { animation: tkb-land 200ms ease-out 1; }
.tkb-card.is-conflict-pair {
  z-index: 3;
  border-style: dashed;
  border-color: var(--tkb-c-warn);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--tkb-c-warn) 28%, transparent),
              0 6px 18px -4px color-mix(in srgb, var(--tkb-c-warn) 24%, transparent);
}
.tkb-wires {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
  overflow: visible;
}
.tkb-wire {
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-dasharray: 100;
  stroke-dashoffset: 0;
  animation: tkb-wire-draw var(--tkb-d2) var(--tkb-ease) both;
  transition: opacity var(--tkb-d1) var(--tkb-ease), stroke-width var(--tkb-d1) var(--tkb-ease);
}
.tkb-wire.is-off {
  stroke-dasharray: 3 3;
  opacity: .55;
  animation: none;
}
.tkb-wire.is-dim { opacity: .2; }
.tkb-wire.is-focus { stroke-width: 2.6; }
.tkb-wire--up-open {
  stroke: var(--tkb-c-warn);
  stroke-dasharray: 4 3;
  animation: tkb-wire-flow calc(1200ms * var(--tkb-speed, 1)) linear infinite;
}
.tkb-wire--up-done { stroke: var(--tkb-c-done); }
.tkb-wire--down {
  stroke: var(--tkb-c-active);
  stroke-dasharray: 6 3;
  animation: tkb-wire-flow calc(1600ms * var(--tkb-speed, 1)) linear infinite;
}
.tkb-wire--relay {
  stroke: var(--tkb-c-done);
  stroke-width: 2.2;
  filter: drop-shadow(0 0 4px color-mix(in srgb, var(--tkb-c-done) 55%, transparent));
  animation: tkb-relay-pulse calc(900ms * var(--tkb-speed, 1)) var(--tkb-ease) both;
}
.tkb-wire-dot {
  stroke: var(--dsw-alias-bg-base);
  stroke-width: 1.5;
}
.tkb-wire-dot.tkb-wire--up-open { fill: var(--tkb-c-warn); }
.tkb-wire-dot.tkb-wire--up-done,
.tkb-wire-dot.tkb-wire--relay { fill: var(--tkb-c-done); }
.tkb-wire-dot.tkb-wire--down { fill: var(--tkb-c-active); }
.tkb-flights {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  overflow: hidden;
}
.tkb-flight-card {
  box-shadow: 0 14px 32px -6px color-mix(in srgb, var(--dsw-alias-label-primary) 20%, transparent);
}

/* 提示气泡（实测边界 + 光学方向箭头） */
.tkb-tip {
  position: absolute;
  left: 0; top: 0;
  z-index: 20;
  max-width: 240px;
  padding: 6px 9px;
  pointer-events: none;
  border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-label-primary);
  color: var(--dsw-alias-bg-base);
  font-size: 11.5px;
  line-height: 1.4;
  opacity: 0;
  transform: translateY(2px);
  box-shadow: 0 8px 24px color-mix(in srgb, var(--dsw-alias-label-primary) 20%, transparent);
  transition: opacity var(--tkb-d1) var(--tkb-ease), transform var(--tkb-d1) var(--tkb-ease);
}
.tkb-tip[data-show] { opacity: 1; transform: none; }
.tkb-tip b { display: block; font-weight: 600; }
.tkb-tip span { display: block; margin-top: 1px; opacity: .75; }
.tkb-tip span:empty { display: none; }
.tkb-tip__arrow {
  position: absolute;
  width: 7px;
  height: 7px;
  background: var(--dsw-alias-label-primary);
  transform: rotate(45deg);
}
.tkb-tip[data-place="top"] .tkb-tip__arrow { bottom: -3px; }
.tkb-tip[data-place="bottom"] .tkb-tip__arrow { top: -3px; }

/* =====================================================================
   动画关键帧清单（硬件加速，零强制 Repaint）
   ===================================================================== */
@keyframes tkb-flow {
  from { transform: translateY(-100%); }
  to { transform: translateY(220%); }
}
@keyframes tkb-breath {
  0%, 100% { border-color: color-mix(in srgb, var(--tkb-c-active) 34%, var(--dsw-alias-border-l1)); }
  50% { border-color: color-mix(in srgb, var(--tkb-c-active) 68%, var(--dsw-alias-border-l1)); }
}
@keyframes tkb-blink {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .3; transform: scale(0.85); }
}
@keyframes tkb-num-in {
  from { opacity: 0; transform: translateY(35%); }
  to { opacity: 1; transform: none; }
}
@keyframes tkb-wire-draw {
  from { stroke-dashoffset: 100; opacity: .2; }
  to { stroke-dashoffset: 0; opacity: .9; }
}
@keyframes tkb-wire-flow {
  from { stroke-dashoffset: 18; }
  to { stroke-dashoffset: 0; }
}
@keyframes tkb-relay-pulse {
  0% { stroke-dashoffset: 100; opacity: 0; }
  25% { stroke-dashoffset: 0; opacity: 1; }
  75% { stroke-dashoffset: 0; opacity: .9; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
@keyframes tkb-unlock-pulse {
  0% {
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--tkb-c-active) 55%, transparent);
    border-color: var(--tkb-c-active);
  }
  45% {
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--tkb-c-active) 16%, transparent);
    background: color-mix(in srgb, var(--dsw-alias-state-business-tertiary) 55%, var(--dsw-alias-card-fill));
  }
  100% { box-shadow: 0 0 0 0 transparent; }
}
@keyframes tkb-land {
  0% { transform: scale(0.985); }
  50% { transform: scale(1.012); }
  100% { transform: none; }
}
@keyframes tkb-alldone-sweep {
  from { transform: translateX(-100%); }
  to { transform: translateX(100%); }
}
@keyframes tkb-flash {
  0%, 40% {
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--tkb-c-active) 70%, transparent),
                0 0 20px color-mix(in srgb, var(--tkb-c-active) 40%, transparent);
  }
  20%, 60% {
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--tkb-c-active) 25%, transparent),
                0 0 30px color-mix(in srgb, var(--tkb-c-active) 20%, transparent);
  }
  100% { box-shadow: 0 0 0 2px transparent; }
}
@keyframes tkb-rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.tkb-root[data-entering] .tkb-lane__head,
.tkb-root[data-entering] .tkb-lane__body > * {
  animation: tkb-rise calc(480ms * var(--tkb-speed, 1)) var(--tkb-ease) both;
  animation-delay: calc(var(--i, 0) * 45ms);
}

@media (prefers-reduced-motion: reduce) {
  .tkb-root *, .tkb-title * {
    animation-duration: 1ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    transition-delay: 0ms !important;
  }
  .tkb-card__rail::after { opacity: 0 !important; }
}

/* =====================================================================
   宽屏适配：≥540px 三列并排
   ===================================================================== */
@container tkb (min-width: 540px) {
  .tkb-lanes {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    overflow: hidden;

  if (prevText === text) return;
  el._v = text;
  const run = o.anim || ((e, k, p) => e.animate(k, p));
  const can = prevText != null && o.animate && !reduced();
  const num = s => parseInt(String(s).replace(/\D/g, ''), 10) || 0;
  const dir = num(text) >= num(prevText) ? 1 : -1;
  const old = String(prevText == null ? '' : prevText);
  el.replaceChildren();
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const cell = h('span', 'tkb-roll__c');
    const inn = h('span', 'tkb-roll__in', ch);
    cell.append(inn);
    el.append(cell);
    const oi = i - (text.length - old.length);
    const och = oi >= 0 ? old[oi] : '';
    if (can && och !== ch) {
      const opt = { duration: ms(440), delay: o.delay || 0 };
      run(inn, [{ transform: `translateY(${dir * 100}%)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { ...opt, easing: SPRING, fill: 'backwards' });
      if (och) {
        const out = h('span', 'tkb-roll__out', och);
        cell.append(out);
        const a = run(out, [{ transform: 'none', opacity: 1 }, { transform: `translateY(${-dir * 100}%)`, opacity: 0 }], { ...opt, easing: EASE, fill: 'both' });
        a.finished.then(() => out.remove(), () => out.remove());
      }
    }
  }
}

/* ================= 3. 看板（TeamKanbanBoard） ================= */
function createBoard(mount) {

  p2.setAttribute('stroke-width', '1.6');

  const teamLabel = h('span', 'tkb-team__label');

  const teamPop = h('div', 'tkb-team__pop');

  const teamTitle = h('p', 'tkb-team__title');

  const teamBody = h('p', 'tkb-team__body');

  const teamActions = h('div', 'tkb-team__actions');
  const ghostBtn = h('button', 'tkb-team__ghost');
  ghostBtn.type = 'button';
  ghostBtn.textContent = tx('team.cancel');
  const dangerBtn = h('button', 'tkb-team__danger');
  dangerBtn.type = 'button';
  dangerBtn.textContent = tx('team.confirm');

  teamActions.append(ghostBtn, dangerBtn);
  teamPop.append(teamTitle, teamBody, teamActions);
  teamWrap.append(teamBtn, teamPop);

  function openTeamPop() {
    teamPop.hidden = false;
    teamBtn.setAttribute('aria-expanded', 'true');
    refreshUI();
  }
  function closeTeamPop() {
    teamPop.hidden = true;
    teamBtn.setAttribute('aria-expanded', 'false');
    refreshUI();
  }
  function toggleTeamPop() {
    if (teamPop.hidden) openTeamPop(); else closeTeamPop();
  }
  teamBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    hideTip();
    toggleTeamPop();
  });
  ghostBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeTeamPop();
  });
  dangerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeTeamPop();
    commit(() => { ACTIONS.team(); });
  });
  const onDocClick = (e) => {
    if (!teamWrap.contains(e.target) && !e.target.closest('#ptTeamPop')) {
      if (!teamPop.hidden) closeTeamPop();
    }
  };
  document.addEventListener('click', onDocClick);

  head.append(score, strip, matesEl, teamWrap);

  const banner = h('div', 'tkb-banner');
  const bClip = h('div', 'tkb-banner__clip');
  const bBox = h('div', 'tkb-banner__box');
  const bText = h('div', 'tkb-banner__text');
  const bTitle = h('div', 'tkb-banner__title');
  const bMsg = h('div', 'tkb-banner__msg');
  bText.append(bTitle, bMsg);
  bBox.append(icon('error', 'tkb-banner__icon'), bText);
  bClip.append(bBox);
  banner.append(bClip);

  const lanesEl = h('div', 'tkb-lanes');
  const lanes = {};
  const collapsed = new Set();
  function toggleLane(key) {
    const L = lanes[key];
    if (!L || L.el.hasAttribute('data-empty')) return;
    hideTip();
    clearLineage();
    if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
    syncLaneHead(key);
  }
  function syncLaneHead(key) {
    const L = lanes[key];
    const empty = L.el.hasAttribute('data-empty');
    if (empty) collapsed.delete(key);
    const col = !empty && collapsed.has(key);
    L.el.toggleAttribute('data-collapsed', col);
    L.chev.hidden = empty;
    if (empty) {
      L.hd.removeAttribute('role');
      L.hd.removeAttribute('tabindex');
      L.hd.removeAttribute('aria-expanded');
      L.hd.removeAttribute('aria-label');
    } else {
      L.hd.setAttribute('role', 'button');
      L.hd.tabIndex = 0;
      L.hd.setAttribute('aria-expanded', String(!col));
      L.hd.setAttribute('aria-label', tx(col ? 'column.expand' : 'column.collapse', { lane: tx('column.' + key) }));
    }
  }
  LANES.forEach(key => {
    const el = h('section', 'tkb-lane');
    el.dataset.lane = key;
    const hd = h('div', 'tkb-lane__head');
    const name = h('span', 'tkb-lane__name');
    const count = h('span', 'tkb-lane__count tkb-roll');
    const chev = icon('chev', 'tkb-lane__chev');
    hd.append(icon(key), name, count, chev);
    hd.addEventListener('click', () => toggleLane(key));
    hd.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLane(key); }
    });
    const body = h('div', 'tkb-lane__body');
    const empty = h('div', 'tkb-empty');
    empty.append(icon(key));
    empty.setAttribute('data-tip', '');
    empty._tip = () => [tx('column.empty'), ''];
    el.append(hd, body);
    lanesEl.append(el);
    lanes[key] = { el, hd, name, count, chev, body, empty };
  });
  const divider = h('div', 'tkb-divider');
  divider.append(icon('chain'));
  divider.setAttribute('role', 'separator');
  divider.setAttribute('data-tip', '');
  divider._tip = () => [tx('card.blocked'), ''];

  const wires = document.createElementNS(SVGNS, 'svg');
  wires.setAttribute('class', 'tkb-wires');
  const flights = h('div', 'tkb-flights');
  const tip = h('div', 'tkb-tip');
  const tipT = h('b');
  const tipS = h('span');
  const tipArrow = h('i', 'tkb-tip__arrow');
  tip.append(tipT, tipS, tipArrow);
  const sr = h('div', 'tkb-sr');
  sr.setAttribute('aria-live', 'polite');
  root.append(head, banner, lanesEl, wires, flights, tip, sr);
  mount.append(root);

  /* --- 状态 --- */
  const cards = new Map();
  let prev = new Map();
  let vm = null;
  let first = true;
  let expandedId = null;
  let spot = null;
  let pinned = false;
  let awaySnap = null;
  let lastRects = new Map();
  let lastMode = null;

  /* --- 运动登记：新投影到达时一次性收束，DOM 永远是真相 --- */
  const live = new Set();
  const timers = new Set();
  const anim = (el, kf, opt) => {
    const a = el.animate(kf, opt);
    live.add(a);
    const rm = () => live.delete(a);
    a.finished.then(rm, rm);
    return a;
  };
  const later = (fn, d) => {
    const r = { fn };
    r.id = setTimeout(() => { timers.delete(r); fn(); }, d);
    timers.add(r);
  };
  function flushMotion() {
    const pend = [...timers];
    timers.clear();
    pend.forEach(r => { clearTimeout(r.id); r.fn(); });
    [...live].forEach(a => { try { a.finish(); } catch (e) { a.cancel(); } });
    live.clear();
    flights.replaceChildren();
    cards.forEach(el => { el.style.visibility = ''; });
  }
  const pulse = (el, cls, dur) => {
    if (!el) return;
    el._pt = el._pt || {};
    clearTimeout(el._pt[cls]);
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    el._pt[cls] = setTimeout(() => el.classList.remove(cls), ms(dur) + 80);
  };
  function setLive(el, attr, on, period) {
    const has = el.hasAttribute(attr);
    if (on && !has) {
      clearTimeout(el._lf);
      el.style.setProperty('--tkb-phase', phase(period));
      el.removeAttribute(attr + '-out');
      el.setAttribute(attr, '');
    } else if (!on && has) {
      el.removeAttribute(attr);
      el.setAttribute(attr + '-out', '');
      clearTimeout(el._lf);
      el._lf = setTimeout(() => el.removeAttribute(attr + '-out'), ms(520));
    }
  }
  const canAnimate = () => root.isConnected && root.offsetParent !== null && root.clientWidth > 0;
  const rel = (el, rr) => { const r = el.getBoundingClientRect(); return { x: r.left - rr.left, y: r.top - rr.top, w: r.width, h: r.height }; };
  function measureAll() {
    const rr = root.getBoundingClientRect();
    lastRects = new Map();
    cards.forEach((el, id) => { if (el.isConnected) lastRects.set(id, rel(el, rr)); });
    return lastRects;
  }

  /* --- 顶部 --- */
  function slotTip(s) {
    if (s._task) return [`#${shortId(s._task.id)} ${s._task.subject}`, statusText(s._task)];
    const kind = { done: tx('column.completed'), active: tx('column.in_progress'), ready: tx('card.ready'), blocked: tx('card.blocked') }[s.dataset.s];
    return [String(s._n), kind];
  }
  function patchHeader(next, landing, animate) {
    const { total, counts } = next;
    scoreDone.style.setProperty('--tkb-sd', `${landing}ms`);
    roll(scoreDone, String(counts.completed), { delay: landing, animate, anim });
    roll(scoreTotal, '/' + total, { animate, anim });

    const prop = total > 24;
    const data = prop
      ? [['done', counts.completed], ['active', counts.in_progress], ['ready', next.ready.length], ['blocked', next.blocked.length]]
      : [].concat(next.done.map(t => ['done', t]), next.active.map(t => ['active', t]), next.ready.map(t => ['ready', t]), next.blocked.map(t => ['blocked', t]));
    while (strip.childElementCount < data.length) {
      const s = h('span', 'tkb-slot');
      s.append(h('span', 'tkb-slot__bar'));
      s.setAttribute('data-tip', '');
      s._tip = () => slotTip(s);
      strip.append(s);
      if (animate && !reduced()) anim(s, [{ flexGrow: 0, opacity: 0 }, { flexGrow: 1, opacity: 1 }], { duration: ms(420), easing: EASE });
    }
    while (strip.childElementCount > data.length) strip.lastElementChild.remove();
    [...strip.children].forEach((s, i) => {
      const [kind, x] = data[i];
      s.style.setProperty('--i', i);
      s.style.setProperty('--tkb-sd', landing ? `${landing + ms(i * 16)}ms` : '0ms');
      if (prop) { s.style.flexGrow = x; s._task = null; s._n = x; } else { s.style.flexGrow = ''; s._task = x; }
      s.dataset.s = kind;
    });

    patchMates(next, animate);

    const allDone = total > 0 && counts.completed === total;
    if (allDone && !root.hasAttribute('data-alldone')) {
      root.setAttribute('data-alldone', '');
    } else if (!allDone) root.removeAttribute('data-alldone');
  }
  function togglePin(id) {
    if (pinned && spot === id) { pinned = false; setSpot(null); } else { pinned = true; setSpot(id); }
  }
  function mkMateChip(m) {
    const c = h('span', 'tkb-mc');
    c._id = m.id;
    const av = h('span', 'tkb-mate');
    if (m.lead) av.setAttribute('data-lead', '');
    const dot = h('span', 'tkb-mate__dot');
    dot.setAttribute('aria-hidden', 'true');
    const txt = document.createTextNode('');
    av.append(dot, txt);
    av._txt = txt;
    const nm = h('span', 'tkb-mc__name');
    c.append(av, nm);
    c._av = av;
    c._nm = nm;
    c.setAttribute('data-tip', '');
    c._tip = () => [mateLabel(m.id), vm && vm.isRunning(m.id) ? tx('card.running') : tx('card.idle')];
    c.addEventListener('pointerenter', () => { if (!pinned) setSpot(m.id); });
    c.addEventListener('pointerleave', () => { if (!pinned) setSpot(null); });
    c.addEventListener('click', e => { e.stopPropagation(); togglePin(m.id); });
    return c;
  }
  function patchMates(next, animate) {
    const ex = new Map();
    [...matesEl.children].forEach(c => ex.set(c._id, c));
    next.mates.forEach((m, i) => {
      let c = ex.get(m.id);
      if (!c) { c = mkMateChip(m); if (animate) pulse(c, 'is-new', 520); }
      ex.delete(m.id);
      const mono = mateMono(m.id);
      c._av._txt.nodeValue = mono;
      c._av.toggleAttribute('data-wide', mono.length > 1);
      c._nm.textContent = mateLabel(m.id);
      setLive(c._av, 'data-running', m.running, 2400);
      if (matesEl.children[i] !== c) matesEl.insertBefore(c, matesEl.children[i] || null);
    });
    ex.forEach(c => c.remove());
    matesEl.hidden = next.mates.length === 0;
  }
  function patchBanner(st) {
    const on = !!st.failure;
    banner.toggleAttribute('data-open', on);
    root.toggleAttribute('data-stale', on);
    if (on) bMsg.textContent = st.failure;
  }

  /* --- 卡片 --- */
  function mkCard(id) {
    const el = h('article', 'tkb-card');
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el._id = id;
    const p = {
      rail: h('span', 'tkb-card__rail'),
      glyph: h('span', 'tkb-card__glyph'),
      id: h('span', 'tkb-card__id'),
      deps: h('span', 'tkb-card__deps'),
      owner: h('span', 'tkb-card__owner'),
      title: h('div', 'tkb-card__title'),
      preview: h('div', 'tkb-card__preview'),
      detail: h('div', 'tkb-card__detail'),
      inner: h('div', 'tkb-card__detail-clip'),
    };
    p.glyph.append(icon('completed'));
    p.detail.append(p.inner);
    el.append(p.rail, p.glyph, p.id, p.deps, p.owner, p.title, p.preview, p.detail);
    el._p = p;
    return el;
  }
  function patchCard(el, t, next, unlocking) {
    const p = el._p;
    const exp = expandedId === t.id;
    const isLive = t.status === 'in_progress' && !!t.ownerId && next.isRunning(t.ownerId);
    el._owner = t.ownerId || null;
    el.dataset.status = t.status;
    el.dataset.ready = t.ready ? 'true' : 'false';
    el.toggleAttribute('data-expanded', exp);
    p.detail.toggleAttribute('aria-hidden', !exp);
    setLive(el, 'data-live', isLive, 1800);
    const idText = '#' + shortId(t.id);
    if (p.id.textContent !== idText) p.id.textContent = idText;
    if (p.title.textContent !== t.subject) p.title.textContent = t.subject;
    const pv = (t.description || '').split('\n')[0];
    if (p.preview.textContent !== pv) p.preview.textContent = pv;
    renderOwner(p.owner, t, next);
    renderDeps(p.deps, t, next, unlocking);
    renderDetail(p.inner, t, next);
    el.setAttribute('aria-expanded', exp ? 'true' : 'false');
    el.setAttribute('aria-label', `#${shortId(t.id)} ${t.subject}，${statusText(t)}`);
  }
  function renderOwner(box, t, next) {
    const key = t.ownerId || (t.status === 'in_progress' ? '-' : '');
    const running = !!(t.ownerId && next.isRunning(t.ownerId));
    const isLive = t.status === 'in_progress' && running;
    const k2 = [key, running ? 1 : 0, isLive ? 1 : 0, LANG].join('|');
    if (box._k === k2) return;
    const changed = box._k !== undefined && box._k.split('|')[0] !== key;
    box._k = k2;
    box.replaceChildren();
    if (key) {
      const ownerId = t.ownerId;
      if (isLive) {
        const ld = h('span', 'tkb-card__live-dot');
        ld.setAttribute('aria-hidden', 'true');
        box.append(ld);
      }
      const nm = h('span', 'tkb-card__owner-name', key === '-' ? tx('card.unowned') : mateLabel(ownerId));
      const av = h('span', 'tkb-mate');
      av.setAttribute('data-tip', '');
      if (key === '-') {
        av.setAttribute('data-none', '');
        av.textContent = '?';
        av._tip = () => [tx('card.unowned'), ''];
      } else {
        const dot = h('span', 'tkb-mate__dot');
        dot.setAttribute('aria-hidden', 'true');
        const mono = mateMono(ownerId);
        av.append(dot, document.createTextNode(mono));
        av.toggleAttribute('data-wide', mono.length > 1);
        if (ownerId === ROOT_ID) av.setAttribute('data-lead', '');
        if (running) av.setAttribute('data-running', '');
        av._tip = () => [mateLabel(ownerId), vm && vm.isRunning(ownerId) ? tx('card.running') : tx('card.idle')];
        av.addEventListener('click', e => { e.stopPropagation(); togglePin(ownerId); });
      }
      box.append(nm, av);
      if (changed && key !== '-') pulse(av, 'is-pop', 480);
    }
    box.append(icon('chev', 'tkb-card__chev'));
  }
  function renderDeps(box, t, next, unlocking) {
    box.replaceChildren();
    box.style.opacity = '';
    if (t.status === 'completed') return;
    box._tok = (box._tok || 0) + 1;
    if (t.status === 'pending') {
      const badge = h('span', 'tkb-badge', t.ready ? tx('card.ready') : tx('card.blockedShort'));
      badge.dataset.kind = t.ready ? 'ready' : 'blocked';
      badge.title = t.ready ? tx('card.ready') : tx('card.blocked');
      box.append(badge);
    }
    const showDeps = t.status === 'pending' && (!t.ready || unlocking) && t.blockedBy.length > 0;
    if (showDeps) {
      box.append(icon('dep', 'tkb-card__deps-arrow'));
      t.blockedBy.forEach(id => {
        const c = h('span', 'tkb-dep', '#' + shortId(id));
        c._id = id;
        const d = next.map.get(id);
        c.toggleAttribute('data-done', !!d && d.status === 'completed');
        c.setAttribute('data-tip', '');
        c._tip = () => { const cur = vm && vm.map.get(id); return cur ? [`#${shortId(id)} ${cur.subject}`, statusText(cur)] : [`#${shortId(id)}`, '']; };
        c.addEventListener('click', e => { e.stopPropagation(); jumpTo(id); });
        box.append(c);
      });
    }
    const openDown = (next.dependents.get(t.id) || []).filter(id => {
      const dep = next.map.get(id);
      return dep && dep.status !== 'completed';
    });
    if (openDown.length > 0) {
      const u = h('span', 'tkb-unlocks');
      if (openDown.length >= 2) u.setAttribute('data-critical', '');
      u.append(icon('down', 'tkb-unlocks__icon'), document.createTextNode(String(openDown.length)));
      u.setAttribute('data-tip', '');
      u._tip = () => [tx('card.blocks'), openDown.map(id => '#' + shortId(id)).join(' · ')];
      box.append(u);
    }
    if (t.writeScopeWarnings && t.writeScopeWarnings.length > 0) {
      const w = h('span', 'tkb-conflict');
      w.append(icon('warn', 'tkb-conflict__icon'));
      w.setAttribute('data-tip', '');
      w._tip = () => [tx('card.writeScopes'), t.writeScopeWarnings[0]];
      w.addEventListener('pointerenter', () => {
        const peers = new Set([t.id]);
        t.writeScopeWarnings.forEach(msg => {
          const ms = String(msg || '').match(/task-\d+/g);
          if (ms) ms.forEach(m => { if (cards.has(m)) peers.add(m); });
        });
        if (peers.size > 1) peers.forEach(pid => cards.get(pid) && cards.get(pid).classList.add('is-conflict-pair'));
      });
      w.addEventListener('pointerleave', () => {
        cards.forEach(c => c.classList.remove('is-conflict-pair'));
      });
      box.append(w);
    }
  }
  function refRow(kind, label, ids, next) {
    const row = h('div', 'tkb-detail__row');
    const icw = h('span', 'tkb-detail__icw');
    icw.append(icon(kind));
    icw.setAttribute('data-tip', '');
    icw._tip = () => [label, ''];
    const items = h('div', 'tkb-detail__items');
    row.append(icw, items);
    ids.forEach(id => {
      const d = next.map.get(id);
      const r = h('button', 'tkb-ref');
      r.type = 'button';
      r.append(icon(d ? d.status : 'pending'), h('span', 'tkb-ref__id', '#' + shortId(id)), h('span', 'tkb-ref__t', d ? d.subject : ''));
      r.addEventListener('click', e => { e.stopPropagation(); jumpTo(id); });
      items.append(r);
    });
    return row;
  }
  function renderDetail(inner, t, next) {
    const downs = next.dependents.get(t.id) || [];
    const stat = ids => ids.map(id => id + ':' + (next.map.get(id) ? next.map.get(id).status : 'x')).join(',');
    const sig = [LANG, t.description, stat(t.blockedBy), stat(downs), t.writeScopes.join('|'), t.writeScopeWarnings.join('|')].join('¦');
    if (inner._sig === sig) return;
    inner._sig = sig;
    const wrap = h('div', 'tkb-detail');
    wrap.append(h('p', 'tkb-detail__desc', t.description || '—'));
    if (t.blockedBy.length) wrap.append(refRow('dep', tx('card.blockedBy'), t.blockedBy, next));

  /* --- 分区排布：就绪在上，阻塞沉到分隔线下 --- */
  function patchLanes(next, ev) {
    const unlocking = new Set(ev.unlocked);
    next.tasks.forEach(t => {
      let el = cards.get(t.id);
      if (!el) { el = mkCard(t.id); cards.set(t.id, el); }
      patchCard(el, t, next, unlocking.has(t.id));
    });
    cards.forEach((el, id) => {
      if (!next.map.has(id)) { el.remove(); cards.delete(id); if (expandedId === id) expandedId = null; }
    });
    LANES.forEach(key => {
      const L = lanes[key];
      let desired;
      if (key === 'pending') {
        desired = next.ready.map(t => cards.get(t.id));
        if (next.ready.length && next.blocked.length) desired.push(divider);
        next.blocked.forEach(t => desired.push(cards.get(t.id)));
      } else desired = next.lanes[key].map(t => cards.get(t.id));
      if (!desired.length) desired.push(L.empty);
      desired.forEach((node, i) => { if (L.body.children[i] !== node) L.body.insertBefore(node, L.body.children[i] || null); });
      while (L.body.childElementCount > desired.length) L.body.lastElementChild.remove();
      L.el.toggleAttribute('data-empty', next.lanes[key].length === 0);

  /* --- 动效 --- */
  function ghostOf(el) {

  /* 跨列飞行：外层裁切盒负责位移与尺寸，内部新旧两张快照交叉淡化 */
  function flyCard(el, gOld, from, to, status, F, delay = 0) {
    const tok = el._ft = (el._ft || 0) + 1;
    const gNew = ghostOf(el);
    el.style.visibility = 'hidden';
    const w = h('div', 'tkb-flight');
    w.dataset.to = status;
    Object.assign(w.style, {
      position: 'absolute',
      pointerEvents: 'none',
      zIndex: '10',

      height: from.h + 'px',
      overflow: 'hidden'

    Object.assign(gOld.style, { position: 'absolute', inset: '0', width: from.w + 'px', height: from.h + 'px' });
    Object.assign(gNew.style, { position: 'absolute', inset: '0', width: to.w + 'px', height: to.h + 'px' });
    w.append(gOld, gNew);
    flights.append(w);
    const dx = to.x - from.x, dy = to.y - from.y, dist = Math.hypot(dx, dy) || 1;
    const lift = Math.min(20, 6 + dist * .05);

    if (py > 0 || (Math.abs(py) < 1e-6 && px > 0)) { px = -px; py = -py; }
    anim(w, [
      { transform: 'translate(0px,0px) scale(1)', width: from.w + 'px', height: from.h + 'px' },
      { transform: `translate(${dx * .5 + px * lift}px,${dy * .5 + py * lift}px) scale(1.035)`, offset: .45 },
      { transform: `translate(${dx}px,${dy}px) scale(1)`, width: to.w + 'px', height: to.h + 'px' },
    ], { duration: F, delay, easing: 'cubic-bezier(.5,.05,.2,1)', fill: 'forwards' });

      w.remove();
      if (el._ft === tok) { el.style.visibility = ''; pulse(el, 'is-landed', 800); }

  }
  function vanish(g, b, rm) {
    const w = h('div', 'tkb-flight tkb-flight--vanish');
    Object.assign(w.style, {
      position: 'absolute',
      pointerEvents: 'none',
      zIndex: '10',
      left: b.x + 'px',
      top: b.y + 'px',
      width: b.w + 'px',
      height: b.h + 'px',
      overflow: 'hidden'
