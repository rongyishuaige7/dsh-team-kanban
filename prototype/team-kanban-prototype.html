    Object.assign(g.style, { position: 'absolute', inset: '0', width: b.w + 'px', height: b.h + 'px' });
    w.append(g);
    flights.append(w);
    const D = ms(rm ? 150 : 280);
    anim(w, rm ? [{ opacity: 1 }, { opacity: 0 }] : [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(4px) scale(.94)' }], { duration: D, easing: EASE, fill: 'forwards' });

  }
  function fadeDeps(el) {
    const box = el._p.deps;
    if (!box.firstChild || el.dataset.status !== 'pending' || el.dataset.ready !== 'true') return;
    if (reduced() || !canAnimate()) { box.replaceChildren(); return; }
    const tok = box._tok;
    anim(box, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-4px)' }], { duration: ms(240), easing: EASE })
      .finished.then(() => { if (box._tok === tok) { box.style.opacity = '0'; box.replaceChildren(); box.style.opacity = ''; } }, () => {});
  }
  function motion(next, ev, before, ghosts, o) {
    const { rm, crowd, F } = o;
    const after = lastRects;
    const doneNow = new Set(ev.moved.filter(m => m.to === 'completed').map(m => m.id));
    const moved = new Map(ev.moved.map(m => [m.id, m]));
    const movedIndex = new Map(ev.moved.map((m, i) => [m.id, i]));
    /* 因果编排：被「刚完成的任务」解锁的卡片，等上游落地后再解锁 */
    const hold = new Map();
    if (!rm && !crowd) {
      const maxF = F + ms(Math.min(ev.moved.length, 6) * 30);
      ev.unlocked.forEach(id => { if (next.map.get(id).blockedBy.some(b => doneNow.has(b))) hold.set(id, maxF + ms(160)); });
    }
    cards.forEach((el, id) => {
      const b = before.get(id), a = after.get(id);

          pulse(el, 'is-landed', 800);
        } else {
          const mInfo = moved.get(id);
          const lane = lanes[mInfo.to];
          if (lane && lane.body) {
            const rr = root.getBoundingClientRect();
            const lbr = lane.body.getBoundingClientRect();
            const lbrRel = {
              top: lbr.top - rr.top,
              bottom: lbr.bottom - rr.top,
              left: lbr.left - rr.left,
              right: lbr.right - rr.left,
            };
            if (!(a.y + a.h <= lbrRel.bottom + 2 && a.x >= lbrRel.left - 1)) {
              const errData = {
                id,
                to: a,
                lane: mInfo.to,
                laneBody: lbrRel,
                time: performance.now(),
                step: typeof play !== 'undefined' ? play.step : -1

      const el = cards.get(id);

      anim(el, rm ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: 'translateY(8px) scale(.97)' }, { opacity: 1, transform: 'none' }], { duration: ms(rm ? 150 : 380), delay: d, easing: EASE, fill: 'backwards' });
      pulse(el, 'is-new', 1200 + Math.min(i, 8) * 50);
    });
    ev.unlocked.forEach(id => {
      const el = cards.get(id);
      if (!el) return;
      const d = hold.get(id) || 0;
      if (d) {
        el.dataset.ready = 'false';
        el._p.deps.querySelectorAll('.tkb-dep').forEach(c => { if (doneNow.has(c._id)) c.style.setProperty('--tkb-dd', `${Math.max(0, d - ms(140))}ms`); });
      }
      later(() => { el.dataset.ready = 'true'; pulse(el, 'is-unlocking', 900); }, d);
      later(() => fadeDeps(el), d + ms(1100));

  }
  function entrance() {
    if (reduced()) return;

    matesEl.style.setProperty('--i', 1);
    LANES.forEach((key, li) => {
      lanes[key].hd.style.setProperty('--i', li + 1);
      [...lanes[key].body.children].forEach((c, ci) => c.style.setProperty('--i', Math.min(li + 2 + ci, 10)));
    });

  /* --- 主入口：一份新投影 --- */
  function update(st) {
    flushMotion();
    hideTip();
    clearLineage();
    const next = derive(st);
    const ev = diff(prev, next);
    const animate = !first && canAnimate();
    const rm = reduced();
    const crowd = ev.moved.length > 12;
    const F = ms(460);
    const flying = animate && !rm && !crowd;
    const landing = flying && ev.moved.some(m => m.to === 'completed') ? F + ms(Math.min(ev.moved.length, 6) * 30) : 0;
    const before = new Map(), ghosts = new Map();
    if (animate) {
      const rr = root.getBoundingClientRect();
      cards.forEach((el, id) => {
        before.set(id, rel(el, rr));
        const p = prev.get(id), n = next.map.get(id);
        if (!n || (p && p.status !== n.status)) ghosts.set(id, ghostOf(el));
      });
    }
    patchHeader(next, landing, animate);
    patchBanner(st);
    patchLanes(next, ev);
    const gain = new Set(flying ? ev.moved.map(m => m.to) : []);
    LANES.forEach(key => roll(lanes[key].count, String(next.lanes[key].length), { delay: gain.has(key) ? F : 0, animate, anim }));
    vm = next;
    applySpot();
    measureAll();
    if (animate) motion(next, ev, before, ghosts, { rm, crowd, F });
    else if (first && canAnimate()) entrance();
    if (!first) announce(ev);
    prev = snapshot(next);
    first = false;
    return { ev, landing };
  }

  /* --- 交互：展开 / 跳转 / 按人聚焦 / 依赖链 --- */
  function toggle(id) {
    const sel = window.getSelection && window.getSelection();
    if (sel && sel.toString().trim().length > 0) return;
    const was = expandedId;
    expandedId = was === id ? null : id;
    if (was && cards.get(was)) {
      const wEl = cards.get(was);
      wEl.setAttribute('aria-expanded', 'false');
      wEl.removeAttribute('data-expanded');
      wEl._p.detail.setAttribute('aria-hidden', 'true');
    }
    if (expandedId) {
      const el = cards.get(expandedId);
      el.setAttribute('aria-expanded', 'true');
      el.setAttribute('data-expanded', '');
      el._p.detail.removeAttribute('aria-hidden');
      setTimeout(() => { if (expandedId === id) el.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' }); }, ms(240));
    }
  }
  function jumpTo(id) {
    const el = cards.get(id);
    if (!el) return;
    const laneKey = el.dataset.status;
    if (laneKey && collapsed.has(laneKey)) {
      collapsed.delete(laneKey);
      syncLaneHead(laneKey);
    }
    el.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
    el.focus({ preventScroll: true });
    setTimeout(() => pulse(el, 'is-flash', 1100), reduced() ? 0 : ms(260));
  }
  function setSpot(id) {
    spot = id;
    if (!id) pinned = false;

  }
  function applySpot() {
    if (spot) root.dataset.spot = spot; else root.removeAttribute('data-spot');
    cards.forEach(el => el.classList.toggle('is-spot', !!spot && el._owner === spot));
    [...matesEl.children].forEach(c => {
      c.classList.toggle('is-spot', c._id === spot);
      c.classList.toggle('is-pinned', pinned && c._id === spot);
    });
  }
  function anchorOf(el, rr) {
    const r = rel(el, rr);
    const br = rel(el.parentElement, rr);
    let cy = r.y + Math.min(r.h / 2, 20);
    let off = false;
    if (cy < br.y + 4) { cy = br.y + 4; off = true; } else if (cy > br.y + br.h - 4) { cy = br.y + br.h - 4; off = true; }
    return { l: r.x, r: r.x + r.w, cx: r.x + r.w / 2, cy, off };
  }
  function drawWires(id, up, down) {
    const rr = root.getBoundingClientRect();
    wires.setAttribute('width', rr.width);
    wires.setAttribute('height', rr.height);
    wires.setAttribute('viewBox', `0 0 ${rr.width} ${rr.height}`);
    const f = anchorOf(cards.get(id), rr);
    const pairs = up.map(u => [u, vm.map.get(u).status === 'completed' ? 'up-done' : 'up-open']).concat(down.map(d => [d, 'down']));
    pairs.forEach(([oid, kind], i) => {
      const el = cards.get(oid);
      if (!el) return;
      const a = anchorOf(el, rr);
      const [s, e] = kind === 'down' ? [f, a] : [a, f];
      let x1, x2, c1, c2;
      if (Math.abs(s.cx - e.cx) > 24) {
        const dir = s.cx < e.cx ? 1 : -1;
        x1 = dir > 0 ? s.r : s.l;
        x2 = dir > 0 ? e.l : e.r;
        const k = Math.max(28, Math.abs(x2 - x1) * .5);
        c1 = [x1 + dir * k, s.cy];
        c2 = [x2 - dir * k, e.cy];
      } else {
        x1 = s.r - 6; x2 = e.r - 6;

        c2 = [x2 + k, e.cy];

      const path = document.createElementNS(SVGNS, 'path');
      path.setAttribute('d', `M${x1},${s.cy} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${x2},${e.cy}`);
      path.setAttribute('pathLength', '100');
      path.setAttribute('class', `tkb-wire tkb-wire--${kind}${off ? ' is-off' : ''}`);
      wires.append(path);
      [[x1, s.cy], [x2, e.cy]].forEach(([x, y]) => {
        const c = document.createElementNS(SVGNS, 'circle');
        c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 2.6);
        c.setAttribute('class', `tkb-wire-dot tkb-wire--${kind}`);

  }
  function showLineage(id) {

  /* --- 事件绑定 --- */

  let tipTimer = 0, tipFor = null, tipHiddenAt = 0;

  /* --- 读屏播报（节流合并） --- */
  let srTimer = 0, srQueue = [];

    revise(t, `· 修订 r${t.revision + 1}：补充边界条件。`);
    return true;
  },
  stall() {
    const t = vis().filter(x => x.status === 'in_progress' && x.ownerId).sort(byNum)[0];
    if (!t) return false;
    setRunning(t.ownerId, !state.running.has(t.ownerId));
    return true;
  },
  del() {
    const deps = new Set(vis().flatMap(t => t.blockedBy));
    const t = vis().filter(x => x.status === 'pending' && !deps.has(x.id)).sort(byNum).pop();
    if (!t) return false;
    t.status = 'deleted';
    logCall('team_task_delete', `#${shortId(t.id)}`);
    return true;
  },
  clear() {
    if (!vis().length) return false;
    vis().forEach(t => { t.status = 'deleted'; });
    state.running.clear();
    logCall('team_task_delete', LANG === 'zh' ? '全部任务' : 'all tasks');
    return true;
  },
  team() { state.enabled = !state.enabled; logCall('agent_team', state.enabled ? 'enabled' : 'disabled'); return true; },
  failure() {
    state.failure = state.failure ? undefined : 'agent-team.jsonl:42 · Unexpected token } in JSON at position 1187';
    logCall('projection', state.failure ? 'agentTeam · failure' : 'agentTeam · recovered');
    return true;
  },
};

/* ================= 8. 导演台 ================= */
const ptPlay = $('#ptPlay');
function refreshUI() {
  const done = play.step >= SCRIPT.length;
  ptPlay.replaceChildren(icon(play.on ? 'pause' : 'play'), h('span', '', play.on ? '暂停' : done ? '重播' : '演示'));
  $('#ptStep').textContent = `${play.step}/${SCRIPT.length}`;
  $('#ptTeam').setAttribute('aria-pressed', String(state.enabled));
  const ptTeamPop = $('#ptTeamPop');
  if (ptTeamPop) ptTeamPop.setAttribute('aria-pressed', String(host.board && host.board.isTeamPopOpen ? host.board.isTeamPopOpen() : false));
  $('#ptFailure').setAttribute('aria-pressed', String(!!state.failure));
  $('#ptReduced').setAttribute('aria-pressed', String(env.reducedToggle));
  $('#ptOthers').setAttribute('aria-pressed', String(host.others));
}
function nope(btn) { btn.classList.remove('is-nope'); void btn.offsetWidth; btn.classList.add('is-nope'); }
$('#ptBar').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'play') { play.on ? pausePlay() : startPlay(); return; }
  if (act === 'next') { pausePlay(); if (play.step < SCRIPT.length) { const s = SCRIPT[play.step++]; commit(() => s.run()); } else nope(btn); return; }
  if (act === 'reset') { resetAll(); setTimeout(startPlay, 500); return; }
  if (act === 'reduced') { env.reducedToggle = !env.reducedToggle; if (host.board) host.board.setReduced(env.reducedToggle); refreshUI(); return; }
  if (act === 'teampop') { if (host.board && host.board.toggleTeamPop) host.board.toggleTeamPop(); return; }
  if (act === 'others') {
    host.others = !host.others;
    if (!host.others && host.active !== 'board') { if (host.boardOpen) activate('board'); else host.active = null; }
    if (host.others && !host.active) activate('files');
    updateTabs(); updateSide(); refreshUI();
    return;
  }
  if (ACTIONS[act]) {
    pausePlay();
    let ok = false;
    commit(() => { ok = ACTIONS[act](); });
    if (!ok) nope(btn);
    return;
  }
  const seg = btn.closest('.pt-seg');
  if (!seg) return;
  const v = btn.dataset.v;
  if (seg.dataset.seg !== 'width') seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  switch (seg.dataset.seg) {
    case 'theme': document.body.dataset.theme = v; break;
    case 'lang':
      LANG = v;
      document.documentElement.lang = v === 'zh' ? 'zh-CN' : 'en';
      relabelChips();
      if (host.board) { host.board.relabel(); updateTitle(host.board.update(state)); }
      break;
    case 'geo':
      host.geo = v;
      side.dataset.geo = v;
      ['width', 'height', 'left', 'top', 'right'].forEach(p => { side.style[p] = ''; });
      if (!reduced()) side.animate([{ opacity: .4, transform: 'scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: ms(260), easing: EASE });
      break;
    case 'width':
      if (host.geo === 'full') { setGeo('dock'); }
      if (host.geo === 'float') side.style.width = v + 'px';
      else side.style.setProperty('--side-w', Math.min(+v, app.clientWidth - 240) + 'px');
      break;
    case 'speed':
      env.speed = +v;
      document.body.style.setProperty('--tkb-speed', v);
      if (host.board) host.board.resync();
      break;
  }
});
function setGeo(v) {
  host.geo = v;
  side.dataset.geo = v;
  ['width', 'height', 'left', 'top', 'right'].forEach(p => { side.style[p] = ''; });
  document.querySelectorAll('[data-seg="geo"] button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
}

/* 停靠：拖拽左缘调宽；浮动：拖拽标签栏空白处移动 */
const grip = $('#sideGrip');
grip.addEventListener('pointerdown', e => {
  if (host.geo !== 'dock') return;
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);
  side.classList.add('is-dragging');
  const startX = e.clientX, startW = side.getBoundingClientRect().width;
  const move = ev => side.style.setProperty('--side-w', Math.max(300, Math.min(app.clientWidth - 240, startW - (ev.clientX - startX))) + 'px');
  const up = () => { side.classList.remove('is-dragging'); grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); };
  grip.addEventListener('pointermove', move);
  grip.addEventListener('pointerup', up);
});
tabsEl.addEventListener('pointerdown', e => {
  if (host.geo !== 'float' || e.target.closest('.chip')) return;
  e.preventDefault();
  tabsEl.setPointerCapture(e.pointerId);
  const ar = app.getBoundingClientRect(), sr = side.getBoundingClientRect();
  const ox = e.clientX - sr.left, oy = e.clientY - sr.top;
  side.style.right = 'auto';
  const move = ev => {
    side.style.left = Math.max(0, Math.min(ar.width - sr.width, ev.clientX - ar.left - ox)) + 'px';
    side.style.top = Math.max(0, Math.min(ar.height - 60, ev.clientY - ar.top - oy)) + 'px';
  };
  const up = () => { tabsEl.removeEventListener('pointermove', move); tabsEl.removeEventListener('pointerup', up); };
  tabsEl.addEventListener('pointermove', move);
  tabsEl.addEventListener('pointerup', up);
});
const ptWidth = $('#ptWidth');
new ResizeObserver(() => { ptWidth.textContent = Math.round(side.getBoundingClientRect().width) + 'px'; }).observe(side);
mq.addEventListener('change', refreshUI);

/* ================= 9. 启动 ================= */
if (LANG === 'en') {
  document.querySelectorAll('[data-seg="lang"] button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === 'en')));
}
relabelChips();
updateTabs();
refreshUI();
sync();
/* 录屏/自动化用 ?play=1 自行掌握起点；此处若无条件启动会与它形成两条并行时间线，把脚本推进成双倍速 */
if (PARAMS.get('play') !== '1') setTimeout(startPlay, 900);
})();
</script>
